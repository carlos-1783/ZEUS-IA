    <!-- Tema inicial ANTES de pintar (sin flash): platino ('light') por
         defecto; oscuro solo si el usuario lo eligió (localStorage
         'zeus_theme', mismo valor que guarda stores/settings.ts) o 'auto'
         con el sistema en oscuro. Tokens en src/assets/styles/zeus-theme-tokens.css. -->
    <script>
      (function () {
        var t = 'light';
        try {
          var s = localStorage.getItem('zeus_theme');
          if (s === 'dark' || s === 'light') t = s;
          else if (s === 'auto') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch (e) { /* sin localStorage: tema base */ }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

      /* Animations */

        transition: opacity 0.3s ease;
      }

      /* Loading animation */

        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: var(--bg-color);
        display: flex;
        justify-content: center;
        align-items: center;

      }

        border-radius: 50%;

        animation: spin 1s ease-in-out infinite;
        margin: 0 auto 1rem;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
